[tool.ruff]
line-length = 100
target-version = "py312"
# extend-exclude keeps ruff's defaults (.venv, build dirs, ...); plain `exclude` would replace them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends()/Query() in defaults is the idiomatic pattern

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = "alembic/versions"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped: the test DB engine (tests/conftest.py) is a module-level singleton whose asyncpg
# connection pool is tied to whichever event loop created it; a function-scoped loop per test
# would hand later tests a pool bound to an already-closed loop ("attached to a different loop").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -p no:cacheprovider"
