name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No job needs a Gemini key or any production credential: AI is off (GEMINI_ENABLED=0) and the
# only secrets used are throwaway values for ephemeral service containers.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decisionforge_test
          POSTGRES_USER: decisionforge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U decisionforge -d decisionforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ASYNC: postgresql+asyncpg://decisionforge:ci-only-password@localhost:5432/decisionforge_test
      DATABASE_URL_SYNC: postgresql+psycopg://decisionforge:ci-only-password@localhost:5432/decisionforge_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      ENVIRONMENT: development
      GEMINI_ENABLED: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: mypy
        run: mypy app scripts
      - name: Alembic - fresh database migration
        run: python -m scripts.db_migrate
      - name: Alembic - models match migrations (no drift)
        run: alembic check
      - name: Tests (unit, integration, API, contract, observability)
        run: pytest -q
      - name: OpenAPI generation
        run: python -m scripts.export_openapi /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build backend image
        run: docker build -t decisionforge-backend backend
