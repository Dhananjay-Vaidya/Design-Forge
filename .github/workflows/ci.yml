name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No job needs a Gemini key or any production credential: AI is off (GEMINI_ENABLED=0) and the
# only secrets used are throwaway values for ephemeral service containers.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decisionforge_test
          POSTGRES_USER: decisionforge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U decisionforge -d decisionforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ASYNC: postgresql+asyncpg://decisionforge:ci-only-password@localhost:5432/decisionforge_test
      DATABASE_URL_SYNC: postgresql+psycopg://decisionforge:ci-only-password@localhost:5432/decisionforge_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      ENVIRONMENT: development
      GEMINI_ENABLED: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: mypy
        run: mypy app scripts
      - name: Alembic - fresh database migration
        run: python -m scripts.db_migrate
      - name: Alembic - models match migrations (no drift)
        run: alembic check
      - name: Tests (unit, integration, API, contract, observability)
        run: pytest -q
      - name: Observability tests (explicit, for a clear signal in the job log)
        run: >-
          pytest -q tests/api/test_observability.py tests/api/test_observability_more.py
          tests/api/test_observability_config.py tests/unit/test_instrumentation.py
      - name: OpenAPI generation
        run: python -m scripts.export_openapi /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool - Prometheus configuration
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/infrastructure/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1
          check config /etc/prometheus/prometheus.yml
      - name: promtool - recording and alert rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/infrastructure/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1
          check rules /etc/prometheus/recording-rules.yml /etc/prometheus/alerts.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grafana provisioning YAML and dashboard JSON parse
        run: |
          pip install pyyaml
          python - <<'PY'
          import json, pathlib, yaml
          root = pathlib.Path("infrastructure/grafana")
          for f in root.glob("provisioning/**/*.yml"):
              yaml.safe_load(f.read_text()); print("ok", f)
          for f in root.glob("dashboards/*.json"):
              d = json.loads(f.read_text()); assert d["panels"], f; print("ok", f)
          PY
      # Behavioural observability tests (metrics, labels, readiness, rules/dashboards guards)
      # run inside the backend job's `pytest -q`, which has the Postgres/Redis services.

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build backend image
        run: docker build -t decisionforge-backend backend
