name: decisionforge

x-backend-env: &backend-env
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decisionforge}
      POSTGRES_USER: ${POSTGRES_USER:-decisionforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decisionforge} -d ${POSTGRES_DB:-decisionforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [decisionforge]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [decisionforge]

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Image CMD: gunicorn + Uvicorn workers. Migrations run via entrypoint (RUN_MIGRATIONS=1).
    environment:
      RUN_MIGRATIONS: "1"
    <<: *backend-env
    volumes:
      - ./backend:/app
      # Read-only, so the contract tests (OpenAPI snapshot, frontend calls, Grafana/Prometheus
      # configs) can run inside the container exactly as they do in CI.
      - ./docs:/docs:ro
      - ./infrastructure:/infrastructure:ro
      - ./frontend/src:/frontend/src:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [decisionforge]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    # Credentials are passed separately (not embedded in a URL) so passwords with special
    # characters need no URL-encoding. Values come from .env; nothing is hardcoded here.
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-decisionforge}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-decisionforge}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-decisionforge}
    # Internal only (no `ports:`); Prometheus scrapes postgres-exporter:9187 on the Compose network.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [decisionforge]

  redis-exporter:
    # -alpine variant: same exporter, but ships wget so a health check is possible.
    image: oliver006/redis_exporter:v1.63.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
      # Empty today (Redis runs without AUTH); set REDIS_PASSWORD in .env if you enable it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Expose the Celery broker queue length as redis_key_size{key="celery"} (backlog alert).
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=celery
    depends_on:
      redis:
        condition: service_healthy
    # Internal only (no `ports:`); Prometheus scrapes redis-exporter:9121.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9121/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [decisionforge]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [decisionforge]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-${GF_SECURITY_ADMIN_USER:-admin}}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${GF_SECURITY_ADMIN_PASSWORD:-change-me}}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [decisionforge]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker -l info --concurrency=2
    <<: *backend-env
    volumes:
      - ./backend:/app
    networks: [decisionforge]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    env_file:
      - .env
    environment:
      # File-change events don't cross Docker Desktop bind mounts; poll so edits hot-reload.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web
    networks: [decisionforge]

networks:
  decisionforge:

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
